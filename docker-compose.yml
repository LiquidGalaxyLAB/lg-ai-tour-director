services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lg-ai-tour-director-backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    restart: unless-stopped
